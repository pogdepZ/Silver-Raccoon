name: Daily Support KB Sync

on:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Sync State Cache
        id: cache-state
        uses: actions/cache/restore@v4
        with:
          path: |
            gemini_state.json
            data/articles
          key: state-sync-gemini-${{ github.run_id }}
          restore-keys: |
            state-sync-gemini-

      - name: Run Synchronizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT_ARTICLES: 50
        run: |
          # Run the main sync script
          python main.py

      - name: Save Sync State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            gemini_state.json
            data/articles
          key: state-sync-gemini-${{ github.run_id }}

      - name: Upload Last Run Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-run-log
          path: logs/last_run.json
          if-no-files-found: warn
