<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiBot Web Console</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React, ReactDOM, and Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; /* bg-slate-900 */
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; /* bg-slate-700 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; /* bg-slate-600 */
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-hidden">
  <div id="root" class="flex-1 flex flex-col h-screen overflow-hidden"></div>

  <!-- React code starts here -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [messages, setMessages] = useState([
        {
          id: 'welcome',
          role: 'assistant',
          content: 'Hello! I am **OptiBot**, the customer-support assistant for OptiSigns. Ask me anything about configuring screens, apps, or troubleshooting player issues!',
          sources: []
        }
      ]);
      const [inputValue, setInputValue] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [syncStats, setSyncStats] = useState(null);
      const [articles, setArticles] = useState([]);
      const [activeStoreName, setActiveStoreName] = useState('Not Initialized');
      const chatEndRef = useRef(null);

      // Fetch Ingestion Statistics & Articles list
      useEffect(() => {
        fetch('/api/status')
          .then(res => res.json())
          .then(data => {
            setActiveStoreName(data.vector_store_name);
            setSyncStats(data.last_run);
            setArticles(data.articles);
          })
          .catch(err => console.error("Error loading status:", err));
      }, []);

      // Auto-scroll chat to bottom
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        // Trigger Lucide icons update
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, isLoading]);

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!inputValue.trim() || isLoading) return;

        const userMessage = {
          id: Date.now().toString(),
          role: 'user',
          content: inputValue.trim()
        };

        setMessages(prev => [...prev, userMessage]);
        setInputValue('');
        setIsLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMessage.content })
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || 'Failed to query assistant');
          }

          const data = await res.json();
          setMessages(prev => [...prev, {
            id: (Date.now() + 1).toString(),
            role: 'assistant',
            content: data.answer,
            sources: data.sources || []
          }]);
        } catch (error) {
          setMessages(prev => [...prev, {
            id: (Date.now() + 1).toString(),
            role: 'assistant',
            content: `⚠️ **Error**: ${error.message}. Please verify your GEMINI_API_KEY environment variable.`,
            sources: []
          }]);
        } finally {
          setIsLoading(false);
        }
      };

      // Helper function to render simple markdown bold and link syntax
      const formatMarkdown = (text) => {
        if (!text) return '';
        // Escape HTML
        let formatted = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        // Convert bullet points
        formatted = formatted.replace(/^\*\s+(.*)$/gm, '<li class="ml-4 list-disc mb-1">$1</li>');
        
        // Convert bold syntax (**text**)
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-white">$1</strong>');
        
        // Convert inline code (`code`)
        formatted = formatted.replace(/`(.*?)`/g, '<code class="bg-slate-800 text-pink-400 px-1.5 py-0.5 rounded text-sm">$1</code>');
        
        // Convert links [text](url)
        formatted = formatted.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" class="text-blue-400 hover:underline inline-flex items-center">$1 <i data-lucide="external-link" class="w-3 h-3 ml-1 inline"></i></a>');
        
        // Convert raw support links into clickable anchors
        formatted = formatted.replace(/(https:\/\/support\.optisigns\.com\/hc\/[^\s\)]+)/g, '<a href="$1" target="_blank" class="text-blue-400 hover:underline">$1</a>');

        // Convert paragraphs
        return formatted.split('\n\n').map(p => {
          if (p.trim().startsWith('<li')) {
            return `<ul class="my-2">${p}</ul>`;
          }
          return `<p class="mb-2 leading-relaxed">${p}</p>`;
        }).join('');
      };

      return (
        <div class="flex-1 flex overflow-hidden h-full">
          {/* LEFT SIDEBAR: Synchronization Stats & Articles list */}
          <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col h-full hidden md:flex shrink-0">
            {/* Logo area */}
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/20">
                O
              </div>
              <div>
                <h1 class="font-bold text-white text-lg leading-tight">OptiBot</h1>
                <span class="text-xs text-slate-400">Gemini RAG Console</span>
              </div>
            </div>

            {/* Sync Dashboard Status */}
            <div class="p-5 border-b border-slate-800 bg-slate-950/40">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i data-lucide="activity" class="w-4 h-4 text-green-500"></i> Sync Dashboard
              </h2>
              
              {syncStats ? (
                <div class="space-y-2.5">
                  <div class="flex justify-between items-center bg-slate-900/60 p-2 rounded border border-slate-800/60">
                    <span class="text-xs text-slate-400">Status</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-green-500/10 text-green-400 border border-green-500/20 flex items-center gap-1 font-medium">
                      <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> Active
                    </span>
                  </div>
                  <div class="grid grid-cols-2 gap-2 text-center text-xs">
                    <div class="bg-slate-900/40 p-2 rounded border border-slate-800/40">
                      <div class="text-slate-400 text-[10px] uppercase">Scraped</div>
                      <div class="text-base font-semibold text-white">{syncStats.total_scraped || 0}</div>
                    </div>
                    <div class="bg-slate-900/40 p-2 rounded border border-slate-800/40">
                      <div class="text-slate-400 text-[10px] uppercase">Added/Upd</div>
                      <div class="text-base font-semibold text-brand-400">{(syncStats.added || 0) + (syncStats.updated || 0)}</div>
                    </div>
                  </div>
                  <div class="text-[11px] text-slate-500 flex justify-between">
                    <span>Skipped: <strong class="text-slate-300">{syncStats.skipped || 0}</strong></span>
                    <span>Removed: <strong class="text-slate-300">{syncStats.removed || 0}</strong></span>
                  </div>
                  <div class="text-[10px] text-slate-500 border-t border-slate-800/50 pt-2 flex flex-col gap-0.5">
                    <span class="truncate">Store: <span class="text-slate-300 font-mono text-[9px]">{activeStoreName.split('/').pop()}</span></span>
                    <span>Last run: <span class="text-slate-400">{syncStats.completed_at ? new Date(syncStats.completed_at).toLocaleString() : 'N/A'}</span></span>
                  </div>
                </div>
              ) : (
                <div class="text-xs text-slate-400 py-3 text-center bg-slate-900/40 rounded border border-slate-800/40">
                  <div class="animate-pulse">Loading sync statistics...</div>
                </div>
              )}
            </div>

            {/* Articles List */}
            <div class="flex-1 flex flex-col overflow-hidden">
              <div class="px-5 py-3 border-b border-slate-800 bg-slate-950/20 flex justify-between items-center shrink-0">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                  <i data-lucide="book-open" class="w-4 h-4 text-brand-500"></i> Articles ({articles.length})
                </h3>
              </div>
              
              <div class="flex-1 overflow-y-auto p-3 space-y-1">
                {articles.map((art, idx) => (
                  <a
                    key={idx}
                    href={art.source_url}
                    target="_blank"
                    class="block p-2 rounded hover:bg-slate-800/50 border border-transparent hover:border-slate-800 group transition-all"
                  >
                    <div class="text-xs font-medium text-slate-200 group-hover:text-brand-400 line-clamp-2 leading-snug">
                      {art.title}
                    </div>
                    <div class="text-[10px] text-slate-500 mt-1 flex items-center justify-between">
                      <span class="font-mono text-[9px]">ID: {art.article_id}</span>
                      <span class="inline-flex items-center gap-0.5 group-hover:text-slate-400">
                        View source <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                      </span>
                    </div>
                  </a>
                ))}
                {articles.length === 0 && (
                  <div class="text-xs text-slate-500 p-8 text-center">
                    No articles loaded. Please run main.py sync.
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* RIGHT MAIN AREA: Chat Interface */}
          <main class="flex-1 flex flex-col bg-slate-950 h-full overflow-hidden relative">
            {/* Header info */}
            <header class="p-5 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div class="flex items-center gap-3">
                <div class="md:hidden w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-white shadow-lg">
                  O
                </div>
                <div>
                  <h2 class="font-bold text-white">OptiBot Customer Support</h2>
                  <p class="text-xs text-slate-400 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                    Online | Grounded Knowledge Base
                  </p>
                </div>
              </div>
              <div class="text-xs text-slate-500 hidden sm:block bg-slate-900 px-3 py-1.5 rounded border border-slate-800">
                Model: <strong class="text-slate-300">gemini-2.5-flash</strong>
              </div>
            </header>

            {/* Chat Thread */}
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
              {messages.map((msg) => (
                <div 
                  key={msg.id} 
                  class={`flex gap-4 max-w-3xl ${msg.role === 'user' ? 'ml-auto flex-row-reverse' : ''}`}
                >
                  {/* Avatar */}
                  <div class={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 shadow-md ${
                    msg.role === 'user' ? 'bg-slate-700 text-white' : 'bg-brand-600 text-white'
                  }`}>
                    {msg.role === 'user' ? (
                      <i data-lucide="user" class="w-4 h-4"></i>
                    ) : (
                      <i data-lucide="bot" class="w-4 h-4"></i>
                    )}
                  </div>

                  {/* Message Bubble Container */}
                  <div class="flex flex-col gap-1.5 max-w-[85%]">
                    {/* Message Bubble */}
                    <div class={`p-4 rounded-xl text-sm leading-relaxed border ${
                      msg.role === 'user' 
                        ? 'bg-brand-600 text-white border-brand-500 shadow-md shadow-brand-500/5' 
                        : 'bg-slate-900/60 text-slate-200 border-slate-800/80 backdrop-blur-sm'
                    }`}>
                      <div 
                        dangerouslySetInnerHTML={{ __html: formatMarkdown(msg.content) }}
                      />
                    </div>

                    {/* Citations/Grounding metadata (only for assistant responses) */}
                    {msg.role === 'assistant' && msg.sources && msg.sources.length > 0 && (
                      <div class="flex flex-wrap gap-2 mt-1">
                        <span class="text-[10px] text-slate-500 flex items-center gap-1 uppercase tracking-wider font-semibold">
                          <i data-lucide="check-circle" class="w-3 h-3 text-brand-500"></i> Grounded Chunks:
                        </span>
                        {msg.sources.map((src, sIdx) => (
                          <span 
                            key={sIdx} 
                            class="text-[10px] px-2 py-0.5 rounded bg-slate-900 text-slate-400 border border-slate-800 max-w-xs truncate"
                            title={src}
                          >
                            {src.split('/').pop()}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ))}

              {/* Bot Loading/Typing State */}
              {isLoading && (
                <div class="flex gap-4 max-w-3xl">
                  <div class="w-9 h-9 rounded-lg bg-brand-600 text-white flex items-center justify-center shrink-0">
                    <i data-lucide="bot" class="w-4 h-4"></i>
                  </div>
                  <div class="bg-slate-900/40 text-slate-200 border border-slate-800/80 p-4 rounded-xl text-sm w-24 flex justify-center items-center">
                    <div class="flex gap-1">
                      <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style={{ animationDelay: '0ms' }}></span>
                      <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style={{ animationDelay: '150ms' }}></span>
                      <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style={{ animationDelay: '300ms' }}></span>
                    </div>
                  </div>
                </div>
              )}
              
              <div ref={chatEndRef} />
            </div>

            {/* Input Bar */}
            <div class="p-5 border-t border-slate-800 bg-slate-950/80 backdrop-blur-md sticky bottom-0 shrink-0">
              <form onSubmit={handleSendMessage} class="max-w-3xl mx-auto flex gap-3">
                <input
                  type="text"
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  disabled={isLoading}
                  placeholder="Ask a question about OptiSigns (e.g. How do I add a YouTube video?)..."
                  class="flex-1 bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                />
                <button
                  type="submit"
                  disabled={isLoading || !inputValue.trim()}
                  class="bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white px-5 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 transition-all shadow-md shadow-brand-500/10 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  <span>Send</span>
                  <i data-lucide="send" class="w-4 h-4"></i>
                </button>
              </form>
              <p class="text-center text-[10px] text-slate-600 mt-3">
                OptiBot operates strictly on support documents from support.optisigns.com. Coded in React + FastAPI.
              </p>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
